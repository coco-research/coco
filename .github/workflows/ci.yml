name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'

      - name: Install pyyaml
        run: pip install pyyaml==6.0.2

      - name: Validate adapter manifests
        run: |
          python3 <<'PY'
          import json, sys, pathlib
          errors = []
          for p in pathlib.Path('adapters').glob('*/manifest.json'):
              try:
                  m = json.loads(p.read_text())
                  for k in ['name', 'version', 'description']:
                      if k not in m:
                          errors.append(f'{p}: missing key "{k}"')
              except json.JSONDecodeError as e:
                  errors.append(f'{p}: invalid JSON — {e}')
          if errors:
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          print(f'All manifests valid.')
          PY

      - name: Adapter install.sh syntax check
        run: |
          for f in adapters/*/install.sh install.sh bin/coco-bootstrap.sh skills/prd-generator/scripts/generate_prd.sh skills/brainstorming/scripts/stop-server.sh tests/check-security-surface.sh tests/check-officecli-install.sh tests/check-install-manifest.sh tests/check-install-safety.sh tests/check-uninstall.sh tests/check-codex-agents-md-paths.sh tests/lib/install-home.sh; do
            bash -n "$f" || { echo "Syntax error in $f"; exit 1; }
          done
          echo "All install scripts pass syntax check."

      - name: Version pins agree
        run: bash tests/check-version-pins.sh

      - name: Validate command cross-references
        run: bash tests/check-command-refs.sh

      - name: Validate officecli install instructions
        run: bash tests/check-officecli-install.sh

      - name: Validate the Claude Code install manifest
        run: bash tests/check-install-manifest.sh

      - name: Validate the Claude Code install safety checks
        run: bash tests/check-install-safety.sh

      - name: Install --workflow (links, printed hook lines, no settings write)
        run: bash tests/check-install-workflow.sh
      - name: Validate the Claude Code uninstall
        run: bash tests/check-uninstall.sh

      - name: coco-gate githook (chain or skip, never overwrite)
        run: bash tests/check-coco-githook-install.sh
      - name: Validate codex AGENTS.md paths exist
        run: bash tests/check-codex-agents-md-paths.sh

      - name: coco-workflow gate cases (forgery, happy path, workflow hygiene)
        run: bash tests/check-coco-gate.sh

      - name: coco-workflow hook cases (deny code edits until the plan is signed)
        run: bash tests/check-coco-workflow-hook.sh

      - name: coco-workflow git-hook cases (pre-commit warning and the H7 show check)
        run: bash tests/check-coco-workflow-githook.sh

      - name: Validate unknown CLI subcommands fail before any clone
        run: bash tests/check-cli-unknown-subcommand.sh

      - name: Validate /team evidence-gate integrity
        run: bash tests/check-evidence-gate.sh

      - name: Validate uninstall removes the update-check cache
        run: bash tests/check-cli-uninstall-cleanup.sh

      - name: Validate CLI refuses a directory that is not the Coco clone
        run: bash tests/check-cli-clone-guard.sh

      - name: Validate roster front-door frontmatter
        run: bash tests/check-roster-frontmatter.sh

      - name: Validate the CLI closing hint
        run: bash tests/check-cli-closing-hint.sh

      - name: Validate no hardcoded adapter list drifts from adapters/
        run: bash tests/check-adapter-drift.sh

      - name: Validate the CLI help lists every adapter
        run: python3 tests/check-help-adapters.py

      - name: Adapter smoke test (dry-run)
        run: |
          for d in adapters/*/; do
            adapter=$(basename "$d")
            echo "--- testing $adapter (dry-run) ---"
            bash adapters/$adapter/install.sh --dry-run > /tmp/$adapter.out 2>&1 || {
              echo "FAIL: $adapter"
              cat /tmp/$adapter.out
              exit 1
            }
            echo "PASS: $adapter"
          done

      - name: Validate root install.sh routing
        run: |
          bash install.sh --list
          bash install.sh --dry-run --adapter claude-code | head -5

      - name: End-to-end packed npx install (Claude Code)
        run: bash tests/e2e-npx-install.sh

      - name: Test npm wrapper syntax
        run: |
          node --check bin/coco.js
          node bin/coco.js --help | head -5

      - name: Hyperframes telemetry is opt-in (no network call unless COCO_HYPERFRAMES_TELEMETRY=1)
        run: node --test systems/hyperframes/skills/media-use/scripts/lib/telemetry.test.mjs

      - name: Caption font generator rejects unrecognised or mislabelled font files
        # lab-0062: any font file in files/ that the generator doesn't embed and check
        # (e.g. a reserved-name subset renamed Orbitron-Bold.woff2) must fail the build.
        run: node --test systems/hyperframes/skills/embedded-captions/modes/standard/fonts/build-fonts-css.test.cjs

      - name: Test build-index.py runs cleanly
        run: |
          python3 scripts/build-index.py
          # confirm all expected outputs exist
          for f in skills/INDEX.md commands/INDEX.md agents/INDEX.md systems/INDEX.md docs/by-domain/pm.md docs/by-domain/engineering.md; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          echo "INDEX files generated successfully."

      - name: Verify INDEX is up to date
        run: |
          python3 scripts/build-index.py
          # systems/INDEX.md is generated too and was previously omitted from this gate, so it
          # could drift silently for as long as nobody happened to regenerate and look.
          if ! git diff --quiet skills/INDEX.md commands/INDEX.md agents/INDEX.md systems/INDEX.md docs/by-domain/; then
            echo "INDEX files are out of date. Run: python3 scripts/build-index.py"
            git diff skills/INDEX.md commands/INDEX.md agents/INDEX.md systems/INDEX.md docs/by-domain/ | head -50
            exit 1
          fi
          echo "INDEX files up to date."

      - name: Verify shipped asset counts match generated truth
        run: bash tests/check-asset-counts.sh

      - name: Verify homepage product rows match data/products.json
        run: python3 tests/check-site-products.py
      - name: Persona attribution wording is in every generated SI command
        run: |
          python3 tests/check-persona-attribution.py
          python3 tests/check-persona-attribution.py --self-test

      - name: Verify the delivery index matches what the adapters install
        run: |
          # adapters/INDEX.md is generated by running every installer into a
          # throwaway HOME, so it records the surface each adapter really delivers
          # rather than the surface its manifest claims. An adapter that stops
          # invoking the Super Intelligence generators drops 342 commands and shows
          # up here as a diff, instead of surfacing as "why is my install missing
          # most of the framework" months later.
          # docs/delivered-counts.json is the claude-code row of the same measurement.
          # The README's "installed by default" figures are gated against it in the
          # asset-count step above, so README -> this file -> a real install is one chain.
          python3 scripts/build-delivery-index.py
          if ! git diff --quiet adapters/INDEX.md docs/delivered-counts.json; then
            echo "Delivery index is out of date. Run: python3 scripts/build-delivery-index.py"
            git diff adapters/INDEX.md docs/delivered-counts.json | head -50
            exit 1
          fi
          echo "Delivery index up to date."

      - name: Default bundle allow-list accounts for every bundle
        run: bash tests/check-default-bundle-allowlist.sh

      - name: Every installable bundle ships a valid pack.json
        run: |
          python3 tests/check-packs.py
          # The self-test plants a defect for each rule in a throwaway tree, so a rule that
          # stops firing fails CI instead of letting a bad pack through.
          python3 tests/check-packs.py --self-test

      - name: Bundle install gate (every advertised bundle must change the install plan)
        run: |
          # Each adapter manifest declares supports_systems. This gate makes that declaration
          # enforceable: for every bundle an adapter advertises, passing --systems <bundle> must
          # actually change that adapter's install plan. Without it, a bundle that installs
          # nothing is indistinguishable from one that works, which is how the phantom
          # "--systems team" survived, and how the generic adapter came to advertise six bundles
          # it never implemented. An empty supports_systems is a valid, checked claim.
          fail=0
          for manifest in adapters/*/manifest.json; do
            adapter=$(basename "$(dirname "$manifest")")
            # Newline-delimited and read with `while read` rather than relying on unquoted
            # word-splitting, which bash does and zsh does not. A maintainer running this by
            # hand in zsh would otherwise silently test only the first bundle.
            bundles=$(python3 -c "import json; print('\n'.join(json.load(open('$manifest'))['supports_systems']))")
            if [ -z "$bundles" ]; then
              # Declaring no bundles is fine, but the adapter must not silently accept the flag
              # and do nothing with it. Either reject it, or leave the plan provably unchanged.
              h=$(mktemp -d)
              if bash "adapters/$adapter/install.sh" --dry-run --systems gsd >/dev/null 2>&1; then
                if ! diff -q <(CLAUDE_HOME="$h/a" bash "adapters/$adapter/install.sh" --dry-run 2>&1) \
                             <(CLAUDE_HOME="$h/b" bash "adapters/$adapter/install.sh" --dry-run --systems gsd 2>&1) >/dev/null 2>&1; then
                  echo "FAIL: $adapter declares no bundles yet --systems changes its plan"
                  fail=1
                else
                  echo "PASS: $adapter declares no bundles and ignores the flag inertly"
                fi
              else
                echo "PASS: $adapter declares no bundles and rejects the flag"
              fi
              continue
            fi
            while IFS= read -r bundle; do
              [ -n "$bundle" ] || continue
              h=$(mktemp -d)
              if diff -q <(CLAUDE_HOME="$h/a" bash "adapters/$adapter/install.sh" --dry-run 2>&1) \
                         <(CLAUDE_HOME="$h/b" bash "adapters/$adapter/install.sh" --dry-run --systems "$bundle" 2>&1) >/dev/null 2>&1; then
                echo "FAIL: $adapter advertises '$bundle' but --systems $bundle leaves the plan unchanged"
                fail=1
              else
                echo "PASS: $adapter installs $bundle"
              fi
            done <<< "$bundles"
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Pack content gate (synthetic self-test)
        # Must not receive the names secret: on pull_request the script is the
        # PR's own code.
        run: python3 tests/check-pack-content.py --self-test

      - name: Pack content gate
        # Every event, including pull_request. No names secret: the internal-name
        # rule skips with a notice, and telemetry, curl|sh, and machine paths
        # still scan this tree. On main this command is the missing-list hard
        # error, so that ref is the secret-bearing step below.
        if: github.ref != 'refs/heads/main'
        run: python3 tests/check-pack-content.py

      - name: Pack content gate on main
        # Real spellings, only on main. An empty secret is a hard error in the script.
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          COCO_PACK_CONTENT_NAMES: ${{ secrets.COCO_PACK_CONTENT_NAMES }}
        run: python3 tests/check-pack-content.py

      - name: Validate the SI team role roster
        run: |
          # The roster is the catalogue a scheduler reads to pick roles and compose their
          # prompts without a human in the loop. Three gates: the definitions satisfy the
          # schema and the layer rules, every validation rule is proven to fire on a
          # known-bad fixture, and commands/team/roles.md matches the roster it is
          # rendered from. The validator exits 0 with capability gaps listed, because a
          # declared gap is a result and an undeclared one is the defect.
          python3 systems/team/validate_roles.py
          python3 systems/team/validate_roles.py --self-test
          python3 systems/team/build_roster.py --check

      - name: Run the standalone test suites
        run: |
          # These suites pass locally but were invoked nowhere in CI, so nothing stopped
          # them rotting. m0-smoke.sh and run_fixtures.sh had no CI coverage at all.
          bash tests/smoke.sh
          bash tests/smoke-home.sh
          bash skills/arch-index/scripts/run_fixtures.sh
          # The team-gate self-tests exercise every gate script against its static fixtures,
          # so a gate that stops failing its fixtures fails CI.
          bash skills/team-gate/scripts/run_fixtures.sh
          bash systems/m0/tests/m0-smoke.sh
          # The generated indexes must not depend on untracked files: a stale
          # systems/<name>/ directory used to produce a phantom bundle row and show
          # up as unexplained INDEX drift on twenty unrelated branches.
          bash tests/check-index-tracks-git.sh
          # The README one-line bootstrap must survive the npm CLI's ~/.coco update cache.
          bash tests/check-bootstrap-coco-dir.sh
          if ! git diff --quiet; then
            echo "A test suite left the tree dirty:"
            git diff --stat
            exit 1
          fi

      - name: RSI stats self-test
        run: python3 evals/paired.py --self-test

      - name: Skill eval harness self-test
        run: python3 evals/skills/score.py --self-test

      - name: Routing description split (offline)
        run: bash tests/check-routing-descriptions.sh
      - name: Skill improve-round core tests
        run: python3 -m unittest tests/test_skill_improve.py

      - name: Pilot skill graders
        run: python3 -m unittest tests/test_skill_graders_docs.py

      - name: Skill grader tests
        run: python3 -m unittest tests/test_skill_graders.py

      - name: Router M0 decision log (opt-in, hash only)
        run: python3 -m unittest tests/test_meta_select_m0.py tests/test_meta_select_embed.py

      - name: Code verification skill grader
        run: python3 -m unittest tests/test_skill_grader_codeverify.py

  router-eval:
    # Router regression gate (router eval audit step 3). Reruns evals/routing/score.py
    # in auto mode on the heldout split and fails if top-1 or delegate precision drops
    # below the newest file in evals/routing/runs/ (or the pinned model digest changed).
    # Runs on the self-hosted Mac (no GitHub-hosted minutes) against an Ollama that is
    # already there. Nothing is downloaded or pulled; if Ollama or the model is missing
    # the job fails on main and prints a skip (exit 0) on PRs. No paid API, no key, loopback only.
    # Fork PRs never get the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, local]
    timeout-minutes: 15
    env:
      COCO_EMBED_URL: http://127.0.0.1:11434/v1/embeddings
      COCO_EMBED_MODEL: nomic-embed-text
      COCO_ROUTER_M0: '0'
    steps:
      - uses: actions/checkout@v7

      # No actions/setup-python here: it is broken on this runner (see self-hosted-probe.yml).
      - name: Gate self-test
        run: python3 evals/routing/check_regression.py --self-test

      - name: Routing description split (offline)
        run: bash tests/check-routing-descriptions.sh

      - name: Probe local Ollama
        id: probe
        # A miss fails on main (the resident engine should be up) and is a skip on PRs.
        run: python3 evals/routing/check_regression.py --probe

      - name: Router regression gate
        if: steps.probe.outputs.ok == '1'
        run: python3 evals/routing/check_regression.py --write "$RUNNER_TEMP/router-run.json"
