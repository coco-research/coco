name: Skill scan

# Static scan of the skill folders a pull request changes.
#
# The scanner is SkillSpector (NVIDIA, Apache-2.0, https://github.com/NVIDIA/skillspector),
# pinned to commit 54824463814a0be01360792523ec7245a69190fc (release tag v2.13.4) and
# installed at that commit at run time. It is not vendored: no upstream code lives in
# this repository, and CREDITS.md records it under "Tools used, not bundled".
#
# Static rules only. Every scan runs with --no-llm and the job is given no model
# provider key, so the LLM-backed checks cannot run and no skill content is sent to a
# model. The one network call the static rules make is the OSV lookup for known
# vulnerabilities, against public data; the scanner falls back to offline when that
# call fails.
#
# Exit codes, from the upstream README: 0 = SAFE or CAUTION, 1 = risk score above 50
# (or a --fail-on-findings hit), 2 = usage. The scan step gates on that default exit
# code, and the report step adds an explicit high/critical severity check on top.
# Both jobs share .github/skill-scan/summarize.py to parse reports by schema and print
# rule id, file:line, and severity for each high or critical finding.

env:
  # The commit tagged v2.13.4, not the tag itself: a tag can be moved, a commit cannot.
  SKILLSPECTOR_SHA: 54824463814a0be01360792523ec7245a69190fc   # v2.13.4

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'systems/**/skills/**'
      - '.github/workflows/skill-scan.yml'
      - '.github/skill-scan/**'
      - 'tests/fixtures/skillspector/**'

permissions:
  contents: read

# One run per pull request: a newer push cancels the older run, so a stale scan cannot
# report on a tree that no longer exists.
concurrency:
  group: skill-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan the changed skill folders
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: `origin/<base>...HEAD` needs a merge base to diff from.
          fetch-depth: 0
          persist-credentials: false

      - name: Find the skill folders this pull request changes
        id: changed
        env:
          # Through the environment, never interpolated into the script: a branch name
          # may contain characters a shell would act on.
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed.txt"
          python3 - "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/skill-dirs.txt" <<'PY'
          import pathlib
          import sys

          dirs = set()
          for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              parts = pathlib.PurePosixPath(line.strip()).parts
              if not parts:
                  continue
              if parts[0] == "skills":
                  base, rest = pathlib.Path("skills"), parts[1:]
              elif parts[0] == "systems" and "skills" in parts[1:]:
                  cut = parts.index("skills", 1) + 1
                  base, rest = pathlib.Path(*parts[:cut]), parts[cut:]
              else:
                  continue
              if not rest[:-1]:
                  continue
              # The folder that owns a SKILL.md is the scanned unit, so walk up from the
              # changed file to the nearest ancestor holding one. A file with no such
              # ancestor (a generated index, a licence, a bundle README) is not part of
              # a skill and is skipped rather than scanned as one.
              start = base.joinpath(*rest[:-1])
              for candidate in (start, *start.parents):
                  if candidate == base.parent:
                      break
                  if (candidate / "SKILL.md").is_file():
                      dirs.add(candidate.as_posix())
                      break

          for directory in sorted(dirs):
              print(directory)
          PY
          count=$(grep -c . "$RUNNER_TEMP/skill-dirs.txt" || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "::notice::No changed file belongs to a skill folder; nothing to scan."
          else
            echo "Scanning $count skill folder(s):"
            sed 's/^/  /' "$RUNNER_TEMP/skill-dirs.txt"
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install SkillSpector at the pinned commit
        if: steps.changed.outputs.count != '0'
        # Installed, never vendored. uv and every dependency are pinned: uv by version,
        # SkillSpector by commit, and its dependencies by the upstream uv.lock at that
        # commit.
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'uv==0.13.7'
          uv --version
          dir="$RUNNER_TEMP/skillspector"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 https://github.com/NVIDIA/skillspector.git "$SKILLSPECTOR_SHA"
          git -C "$dir" checkout -q FETCH_HEAD
          test "$(git -C "$dir" rev-parse HEAD)" = "$SKILLSPECTOR_SHA"
          (cd "$dir" && uv sync --frozen --no-dev)
          echo "$dir/.venv/bin" >> "$GITHUB_PATH"

      - name: Scan the changed skill folders (static rules only)
        if: steps.changed.outputs.count != '0'
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/skill-scan"
          mkdir -p "$out"
          : > "$out/exit-codes.txt"
          command -v skillspector
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            report="$out/$(printf '%s' "$dir" | tr '/' '_').json"
            echo "--- $dir"
            # 0 and 1 both leave a report to read. Anything else is a broken run and
            # fails here rather than being read as a clean scan.
            rc=0
            skillspector scan "$dir" --baseline .github/skill-scan/baseline.yaml --no-llm --format json --output "$report" || rc=$?
            case "$rc" in
              0|1) printf '%s\t%s\t%s\n' "$rc" "$dir" "$(basename "$report")" >> "$out/exit-codes.txt" ;;
              *) echo "::error::skillspector exited $rc for $dir"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/skill-dirs.txt"

      - name: Fail on a high or critical finding
        if: steps.changed.outputs.count != '0'
        run: python3 .github/skill-scan/summarize.py "$RUNNER_TEMP/skill-scan" --allow-suppressed systems/m0/skills/m0

  fixtures:
    name: Fixture assertion
    # A scanner nobody has watched fail is not a gate. This job plants a download piped
    # into a shell in tests/fixtures/skillspector/bad/ and asserts the scan reports it,
    # then asserts a clean skill in good/ reports nothing. It runs independently of the
    # scan job, on every trigger of this workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install SkillSpector at the pinned commit
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'uv==0.13.7'
          uv --version
          dir="$RUNNER_TEMP/skillspector"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 https://github.com/NVIDIA/skillspector.git "$SKILLSPECTOR_SHA"
          git -C "$dir" checkout -q FETCH_HEAD
          test "$(git -C "$dir" rev-parse HEAD)" = "$SKILLSPECTOR_SHA"
          (cd "$dir" && uv sync --frozen --no-dev)
          echo "$dir/.venv/bin" >> "$GITHUB_PATH"

      - name: The planted finding fails the scan and the clean skill passes
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/skill-fixtures"
          mkdir -p "$out/bad" "$out/good"

          bad_rc=0
          skillspector scan tests/fixtures/skillspector/bad --no-llm --format json \
            --output "$out/bad/bad.json" --fail-on-findings || bad_rc=$?
          good_rc=0
          skillspector scan tests/fixtures/skillspector/good --no-llm --format json \
            --output "$out/good/good.json" --fail-on-findings || good_rc=$?

          echo "bad/ exit $bad_rc (want 1), good/ exit $good_rc (want 0)"
          # With --fail-on-findings, exit 1 is the upstream contract for "at least one
          # finding", so these two exit codes are the >=1 and ==0 assertions.
          test "$bad_rc" -eq 1 || { echo "::error::bad/ must exit 1, got $bad_rc"; exit 1; }
          test "$good_rc" -eq 0 || { echo "::error::good/ must exit 0, got $good_rc"; exit 1; }

          printf '%s\t%s\t%s\n' "$bad_rc" "tests/fixtures/skillspector/bad" "bad.json" > "$out/bad/exit-codes.txt"
          printf '%s\t%s\t%s\n' "$good_rc" "tests/fixtures/skillspector/good" "good.json" > "$out/good/exit-codes.txt"

          bad_sum_rc=0
          bad_out="$(python3 .github/skill-scan/summarize.py "$out/bad")" || bad_sum_rc=$?
          printf '%s\n' "$bad_out"
          test "$bad_sum_rc" -eq 1 || { echo "::error::summarize.py on bad/ must exit 1, got $bad_sum_rc"; exit 1; }
          printf '%s\n' "$bad_out" | grep -Eq '\[(high|critical)\] [^[:space:]]+ [^[:space:]]*SKILL\.md:[0-9]+ ' \
            || { echo "::error::bad/ summary missing high/critical rule id and SKILL.md:line"; exit 1; }

          good_sum_rc=0
          good_out="$(python3 .github/skill-scan/summarize.py "$out/good")" || good_sum_rc=$?
          printf '%s\n' "$good_out"
          test "$good_sum_rc" -eq 0 || { echo "::error::summarize.py on good/ must exit 0, got $good_sum_rc"; exit 1; }
          printf '%s\n' "$good_out" | grep -Fq '0 problem(s)' \
            || { echo "::error::good/ summary missing 0 problem(s)"; exit 1; }

      - name: The TT3 bridge waiver fixtures enforce the boundary
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/skill-waiver-fixtures"
          mkdir -p "$out"

          run_waiver() {
            local name="$1" dir="$2" allow="$3" want="$4" expect="${5:-}"
            local case_dir="$out/$name"
            mkdir -p "$case_dir"
            local scan_rc=0
            skillspector scan "$dir" --baseline .github/skill-scan/baseline.yaml --no-llm --format json \
              --output "$case_dir/report.json" || scan_rc=$?
            case "$scan_rc" in
              0|1) printf '%s\t%s\t%s\n' "$scan_rc" "$dir" "report.json" > "$case_dir/exit-codes.txt" ;;
              *) echo "::error::$name: skillspector exited $scan_rc"; exit 1 ;;
            esac
            local sum_rc=0 sum_out=""
            if [ -n "$allow" ]; then
              sum_out="$(python3 .github/skill-scan/summarize.py "$case_dir" --allow-suppressed "$allow")" || sum_rc=$?
            else
              sum_out="$(python3 .github/skill-scan/summarize.py "$case_dir")" || sum_rc=$?
            fi
            echo "=== $name (scan=$scan_rc, sum=$sum_rc, want=$want) ==="
            printf '%s\n' "$sum_out"
            test "$sum_rc" -eq "$want" || { echo "::error::$name: summarize.py exited $sum_rc, want $want"; exit 1; }
            if [ "$want" -eq 0 ]; then
              printf '%s\n' "$sum_out" | grep -Eq 'suppressed 1: TT3 scripts/m0_mcp\.py:[0-9]+' \
                || { echo "::error::$name: missing suppressed 1: TT3 scripts/m0_mcp.py:<line>"; exit 1; }
              echo "MATCH $name: scan=$scan_rc sum=$sum_rc want=$want matched=suppressed 1: TT3 scripts/m0_mcp.py:<line>"
            else
              test -n "$expect" || { echo "::error::$name: missing expected error text"; exit 1; }
              printf '%s\n' "$sum_out" | grep -Fq -- "$expect" \
                || { echo "::error::$name: missing expected text: $expect"; exit 1; }
              echo "MATCH $name: scan=$scan_rc sum=$sum_rc want=$want matched=$expect"
            fi
          }

          base="tests/fixtures/skillspector"
          run_waiver "waiver_a" "$base/waiver_a" "$base/waiver_a" 0
          run_waiver "waiver_b" "$base/waiver_b" "$base/waiver_b" 1 "[critical] TT3 scripts/other.py:"
          run_waiver "waiver_c" "$base/waiver_c" "$base/waiver_c" 1 "bridge check: credential-named env key M0_API_TOKEN"
          run_waiver "waiver_d" "$base/waiver_d" "$base/waiver_d" 1 "[high] AST5 scripts/m0_mcp.py:"
          run_waiver "waiver_e" "$base/waiver_e" "$base/waiver_e" 1 "bridge check: disallowed import http.client"
          run_waiver "waiver_f" "$base/waiver_f" "$base/waiver_f" 1 "bridge check: TRANSPORT may only be used in a Compare"
          run_waiver "waiver_g" "$base/waiver_g" "$base/waiver_a" 1 "unexpected suppressed findings for this skill folder"
          run_waiver "waiver_h" "$base/waiver_h" "$base/waiver_h" 1 "sibling check (helper.py): credential-named env key M0_API_TOKEN"
          run_waiver "waiver_i" "$base/waiver_i" "$base/waiver_i" 1 "sibling check (helper.py): disallowed import socket"
          run_waiver "waiver_j" "$base/waiver_j" "$base/waiver_j" 1 "sibling check (helper.py): disallowed env reference .environ"
          run_waiver "waiver_k" "$base/waiver_k" "$base/waiver_k" 1 "sibling check (helper.py): disallowed import http.server"

          wl="$out/waiver_l_skill"; cp -R "$base/waiver_a" "$wl"
          printf 'import asyncio\n' > "$wl/scripts/helper.py"
          run_waiver "waiver_l" "$wl" "$wl" 1 "sibling check (helper.py): disallowed import asyncio"

          wm="$out/waiver_m_skill"; cp -R "$base/waiver_a" "$wm"
          printf 'import os\nT = getattr(os, "environ").get("M0_HOME")\n' > "$wm/scripts/helper.py"
          run_waiver "waiver_m" "$wm" "$wm" 1 "sibling check (helper.py): forbidden name getattr"

          wn="$out/waiver_n_skill"; cp -R "$base/waiver_a" "$wn"
          printf 'import sys\nsys.path.insert(0, "/tmp")\nimport outsidemod\n' > "$wn/scripts/helper.py"
          run_waiver "waiver_n" "$wn" "$wn" 1 "sibling check (helper.py): disallowed import outsidemod"

          wo="$out/waiver_o_skill"; cp -R "$base/waiver_a" "$wo"
          printf '\nX = os.__dict__["environ"]["M0_BASE_URL"]\n' >> "$wo/scripts/m0_mcp.py"
          run_waiver "waiver_o" "$wo" "$wo" 1 "bridge check: forbidden dunder attribute __dict__"

          wp="$out/waiver_p_skill"; cp -R "$base/waiver_a" "$wp"
          printf 'import os\ng = getattr\nT = g(os, "environ").get("M0_HOME")\n' > "$wp/scripts/helper.py"
          run_waiver "waiver_p" "$wp" "$wp" 1 "sibling check (helper.py): forbidden name getattr"

          wq="$out/waiver_q_skill"; cp -R "$base/waiver_a" "$wq"
          printf 'from os import environ\nT = environ["M0_HOME"]\n' > "$wq/scripts/helper.py"
          run_waiver "waiver_q" "$wq" "$wq" 1 "sibling check (helper.py): disallowed from-import os"

          wr="$out/waiver_r_skill"; cp -R "$base/waiver_a" "$wr"
          printf 'import os as o\nT = o.environ.get("M0_HOME")\n' > "$wr/scripts/helper.py"
          run_waiver "waiver_r" "$wr" "$wr" 1 "sibling check (helper.py): disallowed import alias os as o"

          srv="$out/m0_server_skill"
          cp -R "$base/waiver_a" "$srv"
          cp "systems/m0/skills/m0/scripts/m0_server.py" "$srv/scripts/m0_server.py"
          cmp -s "systems/m0/skills/m0/scripts/m0_server.py" "$srv/scripts/m0_server.py"
          run_waiver "m0_server_pass" "$srv" "$srv" 0
